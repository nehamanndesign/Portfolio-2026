<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto-Chaptering</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    width: 900px; height: 580px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  .scene {
    position: relative;
    width: 720px;
  }

  /* Duration label */
  .duration {
    display: flex; justify-content: space-between;
    font-size: 11px; color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* Track */
  .track {
    position: relative;
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
  }
  .track-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: rgba(255,255,255,0.4);
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Chapter marker */
  .ch {
    position: absolute;
    top: 50%;
    transform: translateX(-50%) translateY(-50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  .ch-line {
    width: 1.5px;
    height: 0px;
    background: rgba(255,255,255,0.7);
    transition: height 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
    transform-origin: bottom center;
  }
  .ch-dot {
    width: 7px; height: 7px;
    background: #fff;
    border-radius: 50%;
    margin-top: 0;
    transform: scale(0);
    transition: transform 0.35s cubic-bezier(0.34, 1.6, 0.64, 1);
    flex-shrink: 0;
  }
  .ch-label {
    position: absolute;
    top: 18px;
    white-space: nowrap;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.03em;
    overflow: hidden;
    max-width: 0px;
    transition: max-width 0.5s ease;
  }

  /* Show state */
  .ch.show .ch-line { height: 14px; }
  .ch.show .ch-dot  { transform: scale(1); }
  .ch.show .ch-label { max-width: 200px; }
</style>
</head>
<body>
<div class="scene">
  <div class="duration" id="dur">
    <span>0:00</span><span>50:20</span>
  </div>
  <div class="track">
    <div class="track-fill" id="fill"></div>

    <div class="ch" id="c1" style="left:0%">
      <div class="ch-line"></div>
      <div class="ch-dot"></div>
      <div class="ch-label">Introduction</div>
    </div>
    <div class="ch" id="c2" style="left:21%">
      <div class="ch-line"></div>
      <div class="ch-dot"></div>
      <div class="ch-label">Annual investments</div>
    </div>
    <div class="ch" id="c3" style="left:43%">
      <div class="ch-line"></div>
      <div class="ch-dot"></div>
      <div class="ch-label">Team assignments</div>
    </div>
    <div class="ch" id="c4" style="left:63%">
      <div class="ch-line"></div>
      <div class="ch-dot"></div>
      <div class="ch-label">Growth areas</div>
    </div>
    <div class="ch" id="c5" style="left:82%">
      <div class="ch-line"></div>
      <div class="ch-dot"></div>
      <div class="ch-label">Next steps</div>
    </div>
  </div>
</div>

<script>
const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  const dur  = document.getElementById('dur');
  const fill = document.getElementById('fill');
  const chs  = [1,2,3,4,5].map(i => document.getElementById('c'+i));

  // fade in duration labels
  await wait(300);
  dur.style.opacity = '1';
  await wait(400);

  // fill the track, then markers drop in
  fill.style.width = '100%';
  await wait(500);

  for (const ch of chs) {
    ch.classList.add('show');
    await wait(260);
  }

  await wait(3000);
  location.reload();
}
run();
</script>
</body>
</html>
